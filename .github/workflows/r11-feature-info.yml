name: V13 R11 — matchup / career-stage information test (2025-26 gated)
on:
  workflow_dispatch:
  push:
    paths: ['experiments/r11-feature-info.trigger']
permissions:
  contents: read
  actions: read
jobs:
  r11:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SEASON_RUN: '38642028905'
      PROPS_2025_RUN: '38602363379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Refuse to run unless the pre-registration is committed
        run: test -f PREREG_R11_MATCHUP_INFO.md && git log --oneline -1 -- PREREG_R11_MATCHUP_INFO.md
      - name: Inputs (saved artifacts; no API calls)
        run: |
          for s in 2023 2024 2025; do gh run download "$SEASON_RUN" -n v13-r3-season-$s -D research_data; done
          gh run download "$PROPS_2025_RUN" -n v13-full-opening-props-2025 -D in/props2025
      - name: Provenance gate
        run: |
          python -u -m scripts.quarantine_odds --source bdl_opening_player_props --games research_data/game_history/games_2025.jsonl \
            --odds "$(find in/props2025 -name opening_props_2025.jsonl | head -1)" --out gated/props_2025
      - name: Frozen information test
        run: |
          python -u -m scripts.feature_info_test --props gated/props_2025/eligible.jsonl \
            $(for s in 2023 2024 2025; do echo --stats research_data/regular_player_history/player_stats_regular_$s.jsonl \
              --games research_data/game_history/games_$s.jsonl; done) \
            --out research_results/r11/feature_info_2025.json
          cp gated/props_2025/summary.json research_results/r11/gate_props_2025.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-r11-feature-info
          path: research_results/r11/
          retention-days: 90
