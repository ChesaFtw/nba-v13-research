name: V13 Live odds logger (closing lines and CLV)
on:
  schedule:
    - cron: '7 14-16 * * *'        # hourly in the morning (lines opening)
    - cron: '*/15 17-23 * * *'     # every 15 min from ~1pm ET: injury-report and tip windows
    - cron: '*/15 0-4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-odds-logger
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - id: log
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.log_live_odds --out-dir research_data/live_odds --max-requests 80 --props-window-hours 14
      - name: Upload run files to the weekly release (append-only; existing names are never overwritten)
        if: always() && steps.log.outputs.dir != '' && steps.log.outputs.rows != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="live-odds-${{ steps.log.outputs.week }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Append-only BALLDONTLIE odds observations (logger v2)" --prerelease
          cd "${{ steps.log.outputs.dir }}"
          for f in observations.jsonl raw_responses.jsonl manifest.json; do
            gzip -9 -c "$f" > "${{ steps.log.outputs.stem }}_$f.gz"
            gh release upload "$TAG" "${{ steps.log.outputs.stem }}_$f.gz"
          done
