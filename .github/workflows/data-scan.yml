name: NBA data scan
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14-23 * * *'
    - cron: '0 0-2 * * *'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Query BALLDONTLIE
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -m scripts.daily_scan
