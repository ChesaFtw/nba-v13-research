name: NBA V13 prop data integrity audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prop-integrity-audit.yml'
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        season: [2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Download source player history
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.backfill_player_stats --season ${{ matrix.season }} --max-pages 600
      - name: Build chronological features
        run: python -u -m scripts.build_prop_research --season ${{ matrix.season }} --input research_data/player_history/player_stats_${{ matrix.season }}.jsonl
      - name: Audit features
        run: python -u -m scripts.audit_prop_integrity --season ${{ matrix.season }} --input research_data/prop_research/props_${{ matrix.season }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-prop-integrity-${{ matrix.season }}
          path: research_results/integrity/
          retention-days: 90
          if-no-files-found: warn
