name: V13 Offline Research Tests
on:
  push:
    paths:
      - 'scripts/audit_cached_seasons.py'
      - 'scripts/backfill_games.py'
      - 'tests/test_audit_cached_seasons.py'
      - 'scripts/regular_season_benchmark.py'
      - 'scripts/walk_forward_prop_mae.py'
      - 'scripts/regular_season_filter.py'
      - 'tests/**'
      - '.github/workflows/v13-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-offline-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate offline research code
        run: python -m pytest -q
