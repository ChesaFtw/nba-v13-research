name: V13 Historical Pregame Injury Data Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-injury-probe.yml'
      - 'scripts/collect_historical_injury_reports.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pypdf
      - run: python -m pytest -q
      - name: Collect timestamped official reports for historical holdout sample
        run: python -u -m scripts.collect_historical_injury_reports --start 2026-03-04 --end 2026-03-06 --out research_results/injury_reports/march_2026_sample.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-official-injury-snapshots-march-2026
          path: research_results/injury_reports/
          retention-days: 90
          if-no-files-found: warn
