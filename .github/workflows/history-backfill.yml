name: Historical NBA games backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-backfill.yml'
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Download regular-season games 2022-2025
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -m scripts.backfill_history --seasons 2022 2023 2024 2025
      - name: Preserve historical data as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nba-historical-games-2022-2025
          path: research_data/
          retention-days: 90
