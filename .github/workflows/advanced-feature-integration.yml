name: NBA advanced stats to prediction features
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/advanced-feature-integration.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        season: [2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect advanced stats, full game only
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.collect_extra_sources --kind advanced_v2 --season ${{ matrix.season }} --max-pages 600
      - name: Collect player stats
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.backfill_player_stats --season ${{ matrix.season }} --max-pages 600
      - name: Join advanced history to player-game data without future leakage
        run: python -u -m scripts.build_advanced_features --season ${{ matrix.season }} --players research_data/player_history/player_stats_${{ matrix.season }}.jsonl --advanced research_data/extra_sources/advanced_v2_${{ matrix.season }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-advanced-joined-${{ matrix.season }}
          path: |
            research_data/advanced_features/
            research_data/extra_sources/*manifest.json
          retention-days: 90
          if-no-files-found: warn
