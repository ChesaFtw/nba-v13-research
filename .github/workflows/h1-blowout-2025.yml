name: V13 H1 — blowout minutes in starter props (2025-26, gated) + consistency rerun
on:
  workflow_dispatch:
  push:
    paths: ['experiments/h1-blowout-2025.trigger']
permissions:
  contents: read
  actions: read
jobs:
  h1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SEASON_RUN: '38642028905'
      PROPS_2025_RUN: '38602363379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Refuse to run unless the pre-registration is committed
        run: test -f PREREG_H1_BLOWOUT_MINUTES.md && git log --oneline -1 -- PREREG_H1_BLOWOUT_MINUTES.md
      - name: Inputs (saved artifacts; no API calls)
        run: |
          gh run download "$SEASON_RUN" -n v13-r3-season-2025 -D research_data
          gh run download "$PROPS_2025_RUN" -n v13-full-opening-props-2025 -D in/props2025
      - name: Provenance gate
        run: |
          python -u -m scripts.quarantine_odds --source bdl_opening_player_props --games research_data/game_history/games_2025.jsonl \
            --odds "$(find in/props2025 -name opening_props_2025.jsonl | head -1)" --out gated/props_2025
          python -u -m scripts.quarantine_odds --source bdl_opening_game_odds --games research_data/game_history/games_2025.jsonl \
            --odds research_data/game_odds/opening_2025.jsonl --out gated/game_odds_2025
      - name: H1 frozen test
        run: |
          python -u -m scripts.h1_blowout_minutes --props gated/props_2025/eligible.jsonl \
            --game-odds gated/game_odds_2025/eligible.jsonl \
            --stats research_data/regular_player_history/player_stats_regular_2025.jsonl \
            --games research_data/game_history/games_2025.jsonl --out research_results/h1/h1_blowout_2025.json
      - name: Experiment D rerun on gated inputs (cross-market consistency, exploratory)
        run: |
          python -u -m scripts.cross_market_consistency --games research_data/game_history/games_2025.jsonl \
            --game-odds gated/game_odds_2025/eligible.jsonl --props gated/props_2025/eligible.jsonl \
            --stats research_data/regular_player_history/player_stats_regular_2025.jsonl \
            --out research_results/h1/consistency_2025_gated.json
          for d in gated/*; do cp "$d/summary.json" "research_results/h1/gate_$(basename $d).json"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-h1-blowout-2025
          path: research_results/h1/
          retention-days: 90
