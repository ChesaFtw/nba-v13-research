name: V13 Challenger Projection Pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/challenger-projection-pilot.yml'
      - 'scripts/challenger_projection_pilot.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt scikit-learn
      - run: python -m pytest -q
      - name: Retrieve verified 2025 regular-season pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38584634800 -n v13-regular-pilot-2025 -D .
      - name: Rebuild pregame features from validated regular-season records
        run: python -u -m scripts.build_prop_research --season 2025 --input research_results/regular_season/regular_players_2025.jsonl
      - name: Run challenger competition
        run: python -u -m scripts.challenger_projection_pilot --input research_data/prop_research/props_2025.jsonl --out research_results/challenger/challenger_2025.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-challenger-2025
          path: research_results/challenger/
          retention-days: 90
          if-no-files-found: warn
