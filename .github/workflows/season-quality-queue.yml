name: NBA season quality parallel queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/season-quality-queue.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        season: [2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Audit historical season and schedule features
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.season_quality --season ${{ matrix.season }}
      - uses: actions/upload-artifact@v4
        with:
          name: nba-season-quality-${{ matrix.season }}
          path: research_data/season_quality/
          retention-days: 90
