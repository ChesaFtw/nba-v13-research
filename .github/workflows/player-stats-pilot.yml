name: NBA player statistics pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v13/player_history.py'
      - 'scripts/pilot_player_stats.py'
      - 'tests/test_player_history.py'
      - '.github/workflows/player-stats-pilot.yml'
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Fetch bounded historical player-stat pilot
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.pilot_player_stats --season 2025 --max-pages 10
      - name: Preserve sample and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-stat-pilot
          path: research_data/player_pilot/
          retention-days: 90
