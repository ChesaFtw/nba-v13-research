name: NBA V13 seven-track research launch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-track-research.yml'
jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        task:
          - historical_lines
          - injuries_lineups
          - play_by_play
          - prop_ensemble
          - real_line_backtest
          - confidence_calibration
          - daily_predictions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Execute research track and preserve evidence
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.next_research_tracks --task ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-track-${{ matrix.task }}
          path: research_results/next_tracks/
          retention-days: 90
          if-no-files-found: warn
