name: V13 Market Anchored Spread Total Challenger
on:
  push:
    branches: [main]
    paths: ['.github/workflows/market-residual-challenger.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt scikit-learn numpy
      - run: python -m pytest -q
      - name: Download verified full season game index
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38584634800 -n v13-regular-pilot-2025 -D .
      - name: Run market anchored challenger against historical opening lines
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -u -m scripts.market_residual_challenger --games research_data/game_history/games_2025.jsonl --out research_results/market_residual/challenger_2025.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-market-residual-challenger-2025
          path: research_results/market_residual/
          retention-days: 90
